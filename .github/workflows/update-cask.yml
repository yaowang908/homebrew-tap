name: Update cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump solo cask to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo yaowang908/solo-macos --json tagName -q .tagName)
          version="${tag#v}"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/solo.rb)
          if [ "$version" = "$current" ]; then
            echo "Cask already at ${version}; nothing to do."
            exit 0
          fi
          url="https://github.com/yaowang908/solo-macos/releases/download/${tag}/Solo-${tag}.zip"
          curl -fsSL -o solo.zip "$url"
          sha=$(shasum -a 256 solo.zip | cut -d' ' -f1)
          rm solo.zip
          sed -i "s/^  version \".*\"/  version \"${version}\"/" Casks/solo.rb
          sed -i "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/solo.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/solo.rb
          git commit -m "chore: update solo cask to ${version}"
          git push
